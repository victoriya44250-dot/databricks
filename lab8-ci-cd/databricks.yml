    mode: development
    default: true
    workspace:
      host: https://dbc-a9009abf-9e96.cloud.databricks.com
      profile: lab8_free_dev
    variables:
      catalog: workspace
      bronze_schema: lab8_dev_bronze
      silver_schema: lab8_dev_silver
      gold_schema: lab8_dev_gold

  

  
