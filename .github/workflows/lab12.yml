name: Lab 12 tests and deployment

on:
  pull_request:
    branches: [main]
    paths: ['lab12-rag/**', '.github/workflows/lab12.yml']
  push:
    branches: [main]
    paths: ['lab12-rag/**', '.github/workflows/lab12.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lab12-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check_project.py

  bundle-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lab12-dev
    defaults:
      run:
        working-directory: lab12-rag
    env:
      DATABRICKS_HOST: ${{ secrets.LAB12_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.LAB12_DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: '1.22.1'
      - name: Check dedicated Lab 12 credentials without printing values
        run: |
          test "$DATABRICKS_HOST" = 'https://dbc-675eb05e-f45c.cloud.databricks.com'
          test -n "$DATABRICKS_TOKEN"
      - name: Validate Bundle
        run: databricks bundle validate --strict -t dev
      - name: Review existing-resource deployment plan
        run: |
          mkdir -p evidence
          databricks bundle plan -t dev -o json > evidence/bundle-plan.json
          python -B scripts/check_plan.py evidence/bundle-plan.json --summary evidence/bundle-plan-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: lab12-deployment-plan
          path: lab12-rag/evidence/bundle-plan-summary.json
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, bundle-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lab12-dev
    concurrency:
      group: lab12-dev-deployment
      cancel-in-progress: false
    defaults:
      run:
        working-directory: lab12-rag
    env:
      DATABRICKS_HOST: ${{ secrets.LAB12_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.LAB12_DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: '1.22.1'
      - name: Recheck plan immediately before deployment
        run: |
          mkdir -p evidence
          databricks bundle validate --strict -t dev
          databricks bundle plan -t dev -o json > evidence/bundle-plan.json
          python -B scripts/check_plan.py evidence/bundle-plan.json
      - name: Update the two existing Lab 12 jobs
        run: databricks bundle deploy -t dev
      - name: Verify corpus and filtered retrieval without answer generation
        run: databricks bundle run -t dev rag_smoke
