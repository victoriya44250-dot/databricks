
name: Lab 8 CI/CD


on:
  pull_request:
    branches: [main]
    paths:
      - "lab8-ci-cd/**"
      - "lab7-testing-data-quality/**"
      - ".github/workflows/lab8-ci-cd.yml"

  push:
    branches: [main]
    paths:
      - "lab8-ci-cd/**"
      - ".github/workflows/lab8-ci-cd.yml"

  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab7-testing-data-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest databricks-connect==19.3.0

      - name: Run tests without Spark
        run: |
          python -m pytest -q \
            tests/test_data_quality.py::test_reconciliation_passes \
            tests/test_data_quality.py::test_reconciliation_fails \
            tests/test_data_quality.py::test_aggregate_reconciliation_passes \
            tests/test_data_quality.py::test_aggregate_reconciliation_fails \
            tests/test_transformations.py::test_clean_country_name \
            tests/test_transformations.py::test_parse_year \
            tests/test_transformations.py::test_is_valid_production



  bundle-validation:
    name: Validate Bundle
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: lab8-ci-cd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        if: github.event_name == 'pull_request'
        run: python -m pip install pyyaml

      - name: Check Bundle YAML on PR
        if: github.event_name == 'pull_request'
        run: |
          python -c "import yaml; yaml.safe_load(open('databricks.yml', encoding='utf-8')); print('Bundle YAML syntax OK')"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD Bundle
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t prod

  prod-deployment-plan:
    name: Check PROD Deployment Plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: lab8-ci-cd

    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check PROD deployment plan
        run: databricks bundle plan -t prod

  deploy-prod:
    name: Deploy to PROD
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs:
      - unit-tests
      - bundle-validation

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    concurrency:
      group: lab8-prod-deployment
      cancel-in-progress: false

    defaults:
      run:
        working-directory: lab8-ci-cd

    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy PROD Bundle
        run: databricks bundle deploy -t prod


