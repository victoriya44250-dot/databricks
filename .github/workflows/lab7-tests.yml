
name: Lab 7 Unit Tests

on:
  push:
    paths:
      - "lab7-testing-data-quality/**"
      - ".github/workflows/lab7-tests.yml"
  pull_request:
    paths:
      - "lab7-testing-data-quality/**"
      - ".github/workflows/lab7-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab7-testing-data-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest databricks-connect==19.3.0

      - name: Run tests without Spark
        run: |
          python -m pytest -q \
            tests/test_data_quality.py::test_reconciliation_passes \
            tests/test_data_quality.py::test_reconciliation_fails \
            tests/test_data_quality.py::test_aggregate_reconciliation_passes \
            tests/test_data_quality.py::test_aggregate_reconciliation_fails \
            tests/test_transformations.py::test_clean_country_name \
            tests/test_transformations.py::test_parse_year \
            tests/test_transformations.py::test_is_valid_production
