      schema: viktoriia_kalenichenko_silver
      bronze_schema: viktoriia_kalenichenko_bronze
      silver_schema: viktoriia_kalenichenko_silver
      raw_volume_path: /Volumes/dbr_dev_ua5816bd/viktoriia_kalenichenko/raw_data

    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405619332572019.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/victoriya44250@softserve.academy to make sure we only have a single copy.
      root_path: /Workspace/Users/victoriya44250@softserve.academy/.bundle/${bundle.name}/${bundle.target}
