bundle:
  name: lab12-agri-rag

sync:
  include:
    - src/*.py
    - notebooks/*.py
  exclude:
    - historical/**
    - tests/**
    - scripts/**
    - '*.md'
    - '*.ps1'
    - requirements-dev.txt

resources:
  jobs:
    rag_qa:
      name: lab12-rag-qa-evaluation
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tasks:
        - task_key: answer_and_evaluate
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/05_rag_answer.py
            base_parameters:
              project_root: ${workspace.file_path}
          max_retries: 0
        - task_key: evaluate
          depends_on:
            - task_key: answer_and_evaluate
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/06_evaluation.py
            base_parameters:
              project_root: ${workspace.file_path}
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-ai-search==0.83
    rag_smoke:
      name: lab12-rag-smoke
      max_concurrent_runs: 1
      timeout_seconds: 600
      tasks:
        - task_key: verify_existing_rag
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/07_smoke_test.py
            base_parameters:
              project_root: ${workspace.file_path}
          max_retries: 0
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-ai-search==0.83

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-675eb05e-f45c.cloud.databricks.com
